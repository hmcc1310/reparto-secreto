<style>

{"id":"agorafobico","name":"Agorafóbico","color":"g","team":"g","note":"Ganas si nunca sales de la habitación en la que empezaste. Pierdes si alguna vez cambias de habitación, ya sea como rehén o por un poder, aunque luego regreses.","max":1},
{"id":"ahab","name":"Ahab","color":"g","team":"g","note":"Ganas si Moby termina en la habitación de Bomba y tú terminas en la otra. Juega con Moby.","max":1,"link":"ahab"},

{"id":"embajador-r","name":"Embajador","color":"r","team":"r","note":"Al recibir tu carta, anuncia que eres Embajador y déjala visible toda la partida. Puedes caminar entre las habitaciones. Eres inmune a poderes y condiciones, no votas, no puedes liderar ni ser rehén y no cuentas para el tamaño de la sala ni para Zombi. Usa las dos cartas de Embajador.","max":1,"conds":["inmune"]},
{"id":"anarquista","name":"Anarquista","color":"g","team":"g","note":"Ganas si tu voto contribuye a destituir con éxito a un líder en la mayoría de las rondas. Necesitas 2 rondas de 3 o 3 de 5. Cada ronda cuenta una sola vez.","max":1},
{"id":"angel-a","name":"Ángel","color":"a","team":"a","note":"Empiezas con la condición «honesto». Cuando hables, debes decir la verdad. Puedes despistar sin hablar. Si también adquieres la condición «mentiroso», ambas se cancelan.","max":1,"conds":["honesto"]},
{"id":"angel-r","name":"Ángel","color":"r","team":"r","note":"Empiezas con la condición «honesto». Cuando hables, debes decir la verdad. Puedes despistar sin hablar. Si también adquieres la condición «mentiroso», ambas se cancelan.","max":1,"conds":["honesto"]},
{"id":"ciego-a","name":"Ciego","color":"a","team":"a","note":"Haz lo posible por mantener los ojos cerrados toda la partida. Puedes seguir hablando, recibir condiciones y ser objetivo de poderes. Si te aplican un poder o una condición, deben informarte con honestidad.","max":1},

// ---------- almacenamiento: Firebase o modo de prueba local ----------
function firebaseApi(cfg) {
  firebase.initializeApp(cfg);
  const fs = firebase.firestore();
  const G = code => fs.collection("games").doc(code);
  const P = code => G(code).collection("players");
  const onErr = e => { console.error(e); toast("Sin conexión con la base de datos"); };
  return {
    demo: false,
    async getGame(code) { const s = await G(code).get(); return s.exists ? s.data() : null; },
    createGame: (code, data) => G(code).set(clean(data)),
    updateGame: (code, patch) => G(code).update(clean(patch)),
    watchGame: (code, cb) => G(code).onSnapshot(s => cb(s.exists ? s.data() : null), onErr),
    watchPlayers: (code, cb) => P(code).onSnapshot(q => cb(q.docs.map(d => ({ id: d.id, ...d.data() }))), onErr),
    watchPlayer: (code, pid, cb) => P(code).doc(pid).onSnapshot(s => cb(s.exists ? { id: s.id, ...s.data() } : null), onErr),
    async listPlayers(code) { const q = await P(code).get(); return q.docs.map(d => ({ id: d.id, ...d.data() })); },
    async addPlayer(code, data) { const id = rid(); await P(code).doc(id).set(clean(data)); return id; },
    updatePlayer: (code, pid, patch) => P(code).doc(pid).update(clean(patch)),
    removePlayer: (code, pid) => P(code).doc(pid).delete(),
    async batch(code, gamePatch, playerPatches) {
      const b = fs.batch();
      if (gamePatch) b.update(G(code), clean(gamePatch));
      Object.entries(playerPatches).forEach(([pid, p]) => b.update(P(code).doc(pid), clean(p)));
      await b.commit();
    },
    async listTemplates() { const q = await fs.collection("templates").get(); return q.docs.map(d => ({ id: d.id, ...d.data() })); },
    async saveTemplate(t) { const id = rid(); await fs.collection("templates").doc(id).set(clean(t)); return id; },
    deleteTemplate: id => fs.collection("templates").doc(id).delete(),
    async listGames() { const q = await fs.collection("games").get(); return q.docs.map(d => ({ code: d.id, ...d.data() })); },
    async deleteGame(code) { const q = await P(code).get(); const b = fs.batch(); q.docs.forEach(d => b.delete(d.ref)); b.delete(G(code)); await b.commit(); }
  };
}
function localApi() {
  const K = "rs-demo-db";
  const read = () => ls.get(K) || { games: {}, templates: {} };
  const subs = new Set();
  const fire = () => subs.forEach(f => f());
  const bc = "BroadcastChannel" in window ? new BroadcastChannel(K) : null;
  if (bc) bc.onmessage = fire;
  window.addEventListener("storage", e => { if (e.key === K) fire(); });
  const write = db => { ls.set(K, db); if (bc) bc.postMessage(1); fire(); };
  const gameOf = g => { if (!g) return null; const { players, ...rest } = g; return clean(rest); };
  const plist = g => g ? Object.entries(g.players || {}).map(([id, p]) => ({ id, ...p })) : [];
  const watch = (get, cb) => { let last; const f = () => { const v = get(read()); const k = JSON.stringify(v); if (k !== last) { last = k; cb(v); } }; subs.add(f); setTimeout(f); return () => subs.delete(f); };
  return {
    demo: true,
    async getGame(code) { return gameOf(read().games[code]); },
    async createGame(code, data) { const db = read(); db.games[code] = { ...clean(data), players: {} }; write(db); },
    async updateGame(code, patch) { const db = read(); Object.assign(db.games[code], clean(patch)); write(db); },
    watchGame: (code, cb) => watch(db => gameOf(db.games[code]), cb),
    watchPlayers: (code, cb) => watch(db => plist(db.games[code]), cb),
    watchPlayer: (code, pid, cb) => watch(db => { const p = db.games[code]?.players?.[pid]; return p ? { id: pid, ...p } : null; }, cb),
    async listPlayers(code) { return plist(read().games[code]); },
    async addPlayer(code, data) { const db = read(); const id = rid(); db.games[code].players[id] = clean(data); write(db); return id; },
    async updatePlayer(code, pid, patch) { const db = read(); const p = db.games[code]?.players?.[pid]; if (p) { Object.assign(p, clean(patch)); write(db); } },
    async removePlayer(code, pid) { const db = read(); delete db.games[code].players[pid]; write(db); },
    async batch(code, gamePatch, playerPatches) { const db = read(); const g = db.games[code]; if (gamePatch) Object.assign(g, clean(gamePatch)); Object.entries(playerPatches).forEach(([pid, p]) => { if (g.players[pid]) Object.assign(g.players[pid], clean(p)); }); write(db); },
    async listTemplates() { return Object.entries(read().templates).map(([id, t]) => ({ id, ...t })); },
    async saveTemplate(t) { const db = read(); const id = rid(); db.templates[id] = clean(t); write(db); return id; },
    async deleteTemplate(id) { const db = read(); delete db.templates[id]; write(db); },
    async listGames() { return Object.entries(read().games).map(([code, g]) => ({ code, ...gameOf(g) })); },
    async deleteGame(code) { const db = read(); delete db.games[code]; write(db); }
  };
}

const TIMER_MODES = { 3: [2, 1, 1], 5: [5, 4, 3, 2, 1] };
const newTimer = n => ({ n, mins: TIMER_MODES[n], r: 1, state: "idle", endsAt: null, left: TIMER_MODES[n][0] * 60 });
const tLeft = t => t.state === "run" ? Math.max(0, Math.ceil((t.endsAt - Date.now()) / 1000)) : t.left;
const tOver = t => t.state === "run" && tLeft(t) === 0;
const fmtT = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
let curTimer = null, shownEnd = "", hostNext = null;

function beep() {
  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
  try { const A = new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(d => { const o = A.createOscillator(), v = A.createGain(); o.frequency.value = 880; o.connect(v); v.connect(A.destination); v.gain.setValueAtTime(.25, A.currentTime + d); v.gain.exponentialRampToValueAtTime(.001, A.currentTime + d + .3); o.start(A.currentTime + d); o.stop(A.currentTime + d + .3); }); } catch (e) {}
}
function roundOver(t) {
  const last = t.r >= t.n, d = document.createElement("div");
  d.className = "full n tover";
  d.innerHTML = `<div><span class="lbl">Ronda ${t.r} de ${t.n}</span><b>${last ? "¡Fin del juego!" : "¡Tiempo!"}</b>
    <p>${last ? "Todos revelen sus cartas. ¿La Bomba quedó en la misma habitación que el Presidente?" : "Se acabó la ronda. Los líderes envían a sus rehenes a la otra habitación. Luego el anfitrión inicia la siguiente ronda."}</p>
    ${hostNext && !last ? `<button class="big tnext">Siguiente ronda →</button>` : ""}
    <small>Toca para cerrar</small></div>`;
  const opened = Date.now();
  d.onclick = e => { if (Date.now() - opened < 600) return; if (e.target.closest(".tnext") && hostNext) hostNext(); d.remove(); };
  $$(".tover").forEach(x => x.remove());
  document.body.appendChild(d); beep();
}
function tick() {
  let bar = $("#timerbar");
  const t = curTimer;
  if (!t) { if (bar) bar.hidden = true; document.body.classList.remove("has-timer"); return; }
  if (!bar) { bar = document.createElement("div"); bar.id = "timerbar"; bar.setAttribute("role", "timer"); document.body.appendChild(bar); }
  const s = tLeft(t), over = tOver(t);
  const status = over ? (t.r >= t.n ? "Fin del juego" : "¡Tiempo! Intercambien rehenes") : t.state === "run" ? "En curso" : t.state === "pause" ? "En pausa" : "Esperando al anfitrión";
  bar.hidden = false; document.body.classList.add("has-timer");
  bar.className = (t.state === "run" && s <= 10) ? "hot" : "";
  bar.innerHTML = `<span class="tr">Ronda ${t.r}/${t.n}</span><span class="tc">${fmtT(s)}</span><span class="ts">${status}</span>`;
  const key = `${t.deal}-${t.r}-${t.endsAt}`;
  if (over && shownEnd !== key) { shownEnd = key; if (Date.now() - t.endsAt < 30000) roundOver(t); }
}

// ---------- reglas para mostrar la carta ----------
// Devuelve las condiciones activas y qué puede mostrar el jugador por voluntad propia.
function rulesFor(card, me) {
  const innate = (card.conds || []).filter(c => !(me.cured || []).includes(c));
  const immune = innate.includes("inmune");
  const set = new Set(innate.concat(immune ? [] : (me.acq || [])));
  if (set.has("honesto") && set.has("mentiroso")) { set.delete("honesto"); set.delete("mentiroso"); }
  if (set.has("enamorado") && set.has("odio")) { set.delete("enamorado"); set.delete("odio"); }
  if (set.has("imprudente")) ["timido", "discreto", "paranoico"].forEach(c => { if (set.has(c)) { set.delete(c); set.delete("imprudente"); } });
  let can = { color: true, role: true, full: true };
  const only = keys => Object.keys(can).forEach(k => { if (!keys.includes(k)) can[k] = false; });
  if (set.has("timido")) only([]);
  if (set.has("discreto")) only(["color"]);
  if (set.has("astuto")) only(["full"]);
  if (set.has("paranoico")) { only(["full"]); if (me.paraUsed) can.full = false; }
  return { set, can, immune };
}

// ---------- mazo ----------
const allRoles = B => CATALOG.concat(B.custom || []);
function expand(B) { const out = []; allRoles(B).forEach(r => { for (let i = 0; i < (B.counts[r.id] || 0); i++) out.push(r); }); return out; }
function tcount(list) { const c = { a: 0, r: 0, g: 0, v: 0, x: 0 }; list.forEach(r => c[r.team]++); return c; }
const extraCards = B => (B.bury ? 1 : 0) + ((B.counts.borracho || 0) ? 1 : 0);
function fillTo(B, target) {
  const deck = expand(B).slice();
  if (!B.autofill) return deck;
  const tc = tcount(deck);
  const A = byId("azul"), R = byId("rojo"), J = byId("jugador");
  while (deck.length < target) {
    const left = target - deck.length;
    if (left === 1 && tc.a === tc.r && B.gamblerOdd && !deck.some(r => r.id === "jugador")) { deck.push(J); tc.g++; continue; }
    const r = tc.a <= tc.r ? A : R; tc[r.team]++; deck.push(r);
  }
  return deck;
}
function deckWarnings(B) {
  const has = id => (B.counts[id] || 0) > 0;
  const w = [], i = [];
  if (!has("presidente") && !has("hija-del-presidente")) w.push("Falta el Presidente.");
  if (!has("bomba") && !has("martir")) w.push("Falta la Bomba.");
  Object.values(LINK_NAMES).forEach(g => { const inn = g.filter(has); if (inn.length && inn.length < g.length) w.push(`${inn.map(id => byId(id).name).join(", ")} necesita${inn.length > 1 ? "n" : ""} a ${g.filter(id => !has(id)).map(id => byId(id).name).join(" y ")}.`); });
  const seen = new Set();
  Object.keys(PAIRS).forEach(id => { if (seen.has(id) || LINK_NAMES[id] || Object.values(LINK_NAMES).some(g => g.includes(id))) return; const o = PAIRS[id][0]; seen.add(id); seen.add(o);
    if ((B.counts[id] || 0) !== (B.counts[o] || 0)) i.push(`${byId(id).name} ${COLOR[byId(id).color].toLowerCase()} y ${byId(o).name} ${COLOR[byId(o).color].toLowerCase()} no están parejos.`); });
  if (has("detective") && !B.bury) w.push("Detective necesita jugar con carta enterrada.");
  if (["hija-del-presidente", "martir", "enfermera", "mecanico"].some(has) && !B.bury) i.push("Hija del presidente, Mártir, Enfermera y Mecánico son reservas para jugar con carta enterrada.");
  if (has("enfermera") && !has("doctor")) i.push("Enfermera es reserva del Doctor.");
  if (has("mecanico") && !has("ingeniero")) i.push("Mecánico es reserva del Ingeniero.");
  if (has("borracho")) i.push("Se apartará una carta sobria para el Borracho. Desde la sala lo despiertas al empezar la última ronda.");
  if (B.bury) i.push("Se reparte una carta de más y una queda enterrada al azar (nunca una de los personajes que juegan en pareja o trío).");
  return { w, i };
}

    };
    const group = t => {
      const l = allRoles(B).filter(r => r.team === t);
      if (!l.length) return "";
      return `<details class="teamsec" data-team="${t}" ${open.has(t) ? "open" : ""}><summary><span class="team-label"><span class="dot ${t}"></span>${t === "a" || t === "r" ? TEAM[t] : "Lealtad " + COLOR[t].toLowerCase()} · ${l.length} cartas</span><span class="count">${tc[t]} elegidas</span></summary><div class="deck">${l.map(roleCard).join("")}</div></details>`;
    };
    const sel = allRoles(B).filter(r => B.counts[r.id]);
    const allT = BUILTIN_TEMPLATES.concat(templates);
    const W = deckWarnings(B);
    app().innerHTML = `<div class="wrap">
      <button class="ghost" id="back" style="justify-self:start">← ${editCode ? "Volver a la sala" : "Volver"}</button>
      <div style="display:grid;gap:8px"><span class="eyebrow">${editCode ? "Partida " + esc(editCode) : "Nueva partida"}</span><h1>Elige las cartas</h1></div>
      <div class="stripe"></div>
      ${demoNote()}
      <section class="panel">
        <div class="panel-head"><h2>Plantillas</h2></div>
        <label for="tplSel" class="small">Mazos del reglamento y tus plantillas guardadas
          <div class="row"><select id="tplSel"><option value="">Elige una plantilla…</option>
            <optgroup label="Del reglamento">${BUILTIN_TEMPLATES.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</optgroup>
            ${templates.length ? `<optgroup label="Mis plantillas">${templates.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</optgroup>` : ""}
          </select><button type="button" id="tplLoad">Cargar</button></div>
        </label>
        ${templates.length ? `<div class="chips">${templates.map(t => `<span class="chip tpl"><button type="button" data-tpl="${esc(t.id)}">${esc(t.name)}</button><button type="button" data-deltpl="${esc(t.id)}" aria-label="Borrar plantilla ${esc(t.name)}">×</button></span>`).join("")}</div>` : ""}
        <form id="saveTpl" class="row">
          <input type="text" id="tplName" maxlength="40" placeholder="Nombre para guardar estas cartas como plantilla" value="${esc(tplName)}">
          <button type="submit">Guardar plantilla</button>
        </form>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Reglas de la partida</h2></div>
        <div class="opts">
          <label class="check"><input type="checkbox" id="autofill" ${B.autofill ? "checked" : ""}><span>Completar con Equipo Azul y Equipo Rojo hasta el número de jugadores <span class="muted small">(la plantilla sirve igual para 8 que para 20)</span></span></label>
          <label class="check"><input type="checkbox" id="gamblerOdd" ${B.gamblerOdd ? "checked" : ""}><span>Si quedan impares, agregar a Jugador (gris)</span></label>
          <label class="check"><input type="checkbox" id="pairs" ${B.pairs ? "checked" : ""}><span>Agregar las parejas automáticamente <span class="muted small">(al elegir Mimo azul se agrega Mimo rojo, Doctor con Ingeniero, etc.)</span></span></label>
          <label class="check"><input type="checkbox" id="bury" ${B.bury ? "checked" : ""}><span>Jugar con carta enterrada</span></label>
          <label for="colorRule" class="small">Mostrar solo el color
            <select id="colorRule">
              <option value="auto" ${B.colorRule === "auto" ? "selected" : ""}>Según el reglamento: solo con 11 jugadores o más</option>
              <option value="always" ${B.colorRule === "always" ? "selected" : ""}>Permitido siempre</option>
              <option value="never" ${B.colorRule === "never" ? "selected" : ""}>No permitido</option>
            </select></label>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Cartas</h2><span class="count">${deck.length} elegidas</span></div>
        ${W.w.length || W.i.length ? `<div class="notes">${W.w.map(x => `<span class="w">${esc(x)}</span>`).join("")}${W.i.map(x => `<span class="i">${esc(x)}</span>`).join("")}</div>` : ""}
        <input type="search" id="q" placeholder="Buscar carta por nombre…" value="${esc(q)}" aria-label="Buscar carta">
        ${TEAM_ORDER.map(group).join("")}
        <details class="teamsec"><summary><span class="team-label">Agregar un personaje que no está en la lista</span></summary>
          <form id="addCustom" class="custom-form">
            <input type="text" id="cName" class="n" placeholder="Nombre de la carta" maxlength="40">
            <select id="cTeam" aria-label="Lealtad"><option value="a">Lealtad azul</option><option value="r">Lealtad roja</option><option value="g">Gris</option><option value="v">Verde</option></select>
            <select id="cColor" aria-label="Color impreso"><option value="">Mismo color</option><option value="a">Carta azul</option><option value="r">Carta roja</option><option value="g">Carta gris</option></select>
            <input type="text" id="cNote" class="full" placeholder="Qué hace (opcional)" maxlength="300">
            <button type="submit">Agregar</button>
          </form>
          ${B.custom.length ? `<div class="row" style="margin-top:10px">${B.custom.map(c => `<button type="button" class="ghost" data-delc="${esc(c.id)}">Quitar «${esc(c.name)}»</button>`).join("")}</div>` : ""}
        </details>
      </section>
      <details class="sumbar" id="sumbar" ${sumOpen ? "open" : ""}>
        <summary><span class="sum-title">Resumen · ${deck.length} carta${deck.length === 1 ? "" : "s"}</span>
          <span class="sum-counts">${TEAM_ORDER.filter(t => tc[t]).map(t => `<span><span class="dot ${t}"></span>${tc[t]}</span>`).join("")}</span>
          <span class="sum-more">${sumOpen ? "Ocultar" : "Ver"}</span></summary>
        <div class="sum-body">
          ${sel.length ? TEAM_ORDER.filter(t => sel.some(r => r.team === t)).map(t => `<div class="team-label"><span class="dot ${t}"></span>${t === "a" || t === "r" ? TEAM[t] : "Lealtad " + COLOR[t].toLowerCase()} · ${tc[t]}</div>
            <div class="chips">${sel.filter(r => r.team === t).map(r => `<span class="chip"><span class="dot ${r.color}"></span><span>${esc(r.name)}${B.counts[r.id] > 1 ? " ×" + B.counts[r.id] : ""}</span><button type="button" data-dec="${esc(r.id)}" aria-label="Quitar uno de ${esc(r.name)}">×</button></span>`).join("")}</div>`).join("") : `<p class="muted small">Todavía no eliges cartas.</p>`}
          ${B.autofill ? `<p class="muted small">Al repartir se completa con Equipo Azul y Equipo Rojo hasta el número de jugadores.</p>` : ""}
        </div>
      </details>
      <section class="panel">
        ${editCode ? `<button class="primary big" id="saveGame">Guardar cambios</button>` : `
        <label for="hpin">Tu PIN de anfitrión (4 números)<input type="tel" id="hpin" maxlength="4" inputmode="numeric" placeholder="Para recuperar el panel si cambias de celular" value="${esc(pin)}"></label>
        <button class="primary big" id="create">Crear partida y abrir la sala</button>`}
        <p class="err">${esc(err)}</p>
      </section>
    </div>`;
    $("#back").onclick = () => go(editCode ? hostLobby : home);
    $$("[data-exp]").forEach(el => { const t = () => { const id = el.dataset.exp, open = !expanded.has(id); open ? expanded.add(id) : expanded.delete(id);
      el.setAttribute("aria-expanded", open); $(".note", el).classList.toggle("open", open); const m = $(".more", el); if (m) m.textContent = open ? "Ver menos ▴" : "Ver más ▾"; };
      el.onclick = t; el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } }; });
    $("#sumbar").ontoggle = e => { sumOpen = e.target.open; $(".sum-more").textContent = sumOpen ? "Ocultar" : "Ver"; };
    $$(".teamsec[data-team]").forEach(d => d.ontoggle = () => { d.open ? open.add(d.dataset.team) : open.delete(d.dataset.team); });
    // Si "parejas" está activo, las parejas quedan con el mismo número de cartas.
    const syncPairs = (k, verb) => {
      if (!B.pairs || !PAIRS[k]) return;
      const n = B.counts[k] || 0, moved = [];
      PAIRS[k].forEach(o => { const r = byId(o); if (!r) return; const cur = B.counts[o] || 0, want = Math.min(n, r.max || 1);
        if (verb === "add" ? cur < want : cur > n) { B.counts[o] = verb === "add" ? want : n; if (!B.counts[o]) delete B.counts[o]; moved.push(r.name + (r.name === byId(k).name ? " " + COLOR[r.color].toLowerCase() : "")); } });
      if (moved.length) toast((verb === "add" ? "También se agregó: " : "También se quitó: ") + moved.join(", "));
    };
    $$("[data-inc]").forEach(b => b.onclick = () => { const k = b.dataset.inc; B.counts[k] = (B.counts[k] || 0) + 1; syncPairs(k, "add"); keepScroll(render); });
    $$("[data-dec]").forEach(b => b.onclick = () => { const k = b.dataset.dec; B.counts[k] = Math.max(0, (B.counts[k] || 0) - 1); if (!B.counts[k]) delete B.counts[k]; syncPairs(k, "rm"); keepScroll(render); });
    ["autofill", "gamblerOdd", "bury", "pairs"].forEach(k => $("#" + k).onchange = e => { B[k] = e.target.checked; keepScroll(render); });
    $("#colorRule").onchange = e => { B.colorRule = e.target.value; };
    const loadTpl = t => { B = Object.assign({ autofill: true, bury: false, colorRule: "auto", gamblerOdd: true, pairs: true }, clean(t)); delete B.id; delete B.name; delete B.builtin; toast("Plantilla «" + t.name + "» cargada"); render(); };
    $("#tplLoad").onclick = () => { const id = $("#tplSel").value; const t = allT.find(x => x.id === id); if (t) loadTpl(t); };
    $$("[data-tpl]").forEach(b => b.onclick = () => loadTpl(allT.find(x => x.id === b.dataset.tpl)));
    $$("[data-deltpl]").forEach(b => b.onclick = async () => { await api.deleteTemplate(b.dataset.deltpl); toast("Plantilla borrada"); loadT(); });
    $("#tplName").oninput = e => tplName = e.target.value;
    $("#saveTpl").onsubmit = async e => { e.preventDefault(); const n = tplName.trim(); if (!n) { toast("Escribe un nombre para la plantilla"); return; } await api.saveTemplate({ name: n, counts: B.counts, custom: B.custom, autofill: B.autofill, bury: B.bury, colorRule: B.colorRule, gamblerOdd: B.gamblerOdd }); tplName = ""; toast("Plantilla guardada"); loadT(); };
    $("#q").oninput = e => { q = e.target.value; applyFilter(); };
    $("#addCustom").onsubmit = e => { e.preventDefault(); const name = $("#cName").value.trim(); if (!name) return; const id = "c" + rid(6); const team = $("#cTeam").value; B.custom.push({ id, name, team, color: $("#cColor").value || team, note: $("#cNote").value.trim(), max: 9 }); B.counts[id] = 1; render(); };
    $$("[data-delc]").forEach(b => b.onclick = () => { const id = b.dataset.delc; B.custom = B.custom.filter(c => c.id !== id); delete B.counts[id]; render(); });
    if (editCode) {
      $("#saveGame").onclick = async () => { await api.updateGame(editCode, { setup: B }); ls.set("rs-builder2", B); toast("Cartas actualizadas"); go(hostLobby); };
    } else {
      $("#hpin").oninput = e => pin = e.target.value;
      $("#create").onclick = async () => {
        if (!/^\d{4}$/.test(pin.trim())) { err = "Pon un PIN de 4 números."; return render(); }
        let code; for (let i = 0; i < 8; i++) { code = newCode(); if (!(await api.getGame(code))) break; }
        await api.createGame(code, { setup: B, hostPin: pin.trim(), round: 0, inPlay: [], buried: 0, createdAt: Date.now() });
        ls.set("rs-builder2", B); ls.set("rs-host", { code });
        go(hostLobby);
      };
    }
    applyFilter();
  }
  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
  render(); loadT();
}

// ---------- anfitrión: sala ----------
function hostLobby() {
  const hs = ls.get("rs-host"); if (!hs) return go(home);
  const code = hs.code;
  let game, players = [], gl = false, reveal = false, confirmEnd = false, swapA = "", swapB = "";
  const render = () => {
    if (!gl) return;
    if (!game) { ls.set("rs-host", null); return go(home, "Esa partida ya no existe."); }
    const list = players.slice().sort((a, b) => a.joinedAt - b.joinedAt);
    const n = list.length, S = game.setup;
    const target = n + extraCards(S);
    const deck = fillTo(S, target);
    const started = game.round > 0;
    const late = list.filter(p => !(p.card && p.round === game.round)).length;
    const W = deckWarnings(S);
    let st, cls = "ok", ok = false;
    if (n < 2) { st = "Esperando jugadores"; cls = "warn"; }
    else if (deck.length < target) { st = `Faltan ${target - deck.length} cartas`; cls = "warn"; }
    else if (deck.length > target) { st = `Sobran ${deck.length - target} cartas: quita algunas o espera más jugadores`; cls = "warn"; }
    else { st = "Listo para repartir"; ok = true; }
    const colorAllowed = S.colorRule === "always" || (S.colorRule !== "never" && n >= 11);
    const drunk = list.find(p => p.card && p.round === game.round && p.card.id === "borracho");
    const withCard = list.filter(p => p.card && p.round === game.round);
    const url = location.href.split("#")[0];
    const T = game.timer || newTimer(3);
    app().innerHTML = `<div class="wrap">
      <button class="ghost" id="home" style="justify-self:start">← Inicio</button>
      ${demoNote()}
      <section class="panel lobby-head">
        <span class="eyebrow">Código de la partida</span>
        <div class="bigcode">${esc(code)}</div>
        <p class="muted">Que cada quien abra <b style="color:var(--fg);overflow-wrap:anywhere">${esc(url)}</b> en su celular y escriba este código.</p>
        ${started ? `<span class="pill ok">Reparto ${game.round} hecho</span>` : ""}
      </section>
      ${!started ? `<section class="panel tpanel">
        <div class="panel-head"><h2>Temporizador</h2></div>
        <button class="primary big" disabled>▶ Iniciar ronda 1</button>
        <p class="muted small">Primero reparte las cartas (más abajo, botón «Iniciar y repartir»). Después aquí inicias cada ronda y a todos les aparece el reloj arriba de la pantalla.</p>
      </section>` : ""}
      ${started && T ? `<section class="panel tpanel">
        <div class="panel-head"><h2>Temporizador</h2><span class="count">Ronda ${T.r} de ${T.n}</span></div>
        <div class="row">
          ${T.state === "run" ? `<button class="primary big" id="tPause">⏸ Pausar</button>` : `<button class="primary big" id="tPlay">▶ ${T.state === "pause" ? "Reanudar" : "Iniciar ronda " + T.r}</button>`}
          ${T.r < T.n ? `<button id="tNext">Siguiente ronda →</button>` : ""}
          <button class="ghost" id="tReset">Reiniciar esta ronda</button>
        </div>
        <label for="tMode" class="small">Rondas
          <select id="tMode">
            <option value="3" ${T.n === 3 ? "selected" : ""}>3 rondas: 2, 1 y 1 minutos (menos de 11 jugadores)</option>
            <option value="5" ${T.n === 5 ? "selected" : ""}>5 rondas: 5, 4, 3, 2 y 1 minutos (11 jugadores o más)</option>
          </select></label>
        <p class="muted small">El reloj aparece arriba en el celular de todos. Al llegar a cero, a todos les sale el aviso de fin de ronda.</p>
      </section>` : ""}
      <section class="panel">
        <div class="panel-head"><h2>Jugadores</h2>
          <div class="row">${started ? `<button class="ghost" id="reveal">${reveal ? "Ocultar cartas" : "Ver qué le tocó a cada uno"}</button>` : ""}<span class="count">${n} dentro</span></div></div>
        ${n ? `<ul class="plist">${list.map(p => { const has = p.card && p.round === game.round; return `<li><span class="dot ${reveal && has ? p.card.color : ""}"></span><div style="min-width:0"><div class="nm">${esc(p.name)}</div>${started ? `<div class="rl">${has ? (reveal ? esc(p.card.name) : "Tiene carta") + (p.peeks ? ` · volvió a ver su carta ${p.peeks} ${p.peeks > 1 ? "veces" : "vez"}` : "") : "Sin carta, entra en el próximo reparto"}</div>` : ""}</div><button class="x2" data-kick="${esc(p.id)}" aria-label="Quitar a ${esc(p.name)}">×</button></li>`; }).join("")}</ul>` : `<div class="wait"><div class="pulse"></div><p class="muted">Todavía no entra nadie. Comparte el código.</p></div>`}
        ${started && reveal && (game.buriedCard || game.sober) ? `<p class="small muted">${game.buriedCard ? `Carta enterrada: <b style="color:var(--fg)">${esc(game.buriedCard.name)}</b>. ` : ""}${game.sober ? `Carta sobria del Borracho: <b style="color:var(--fg)">${esc(game.sober.name)}</b>.` : ""}</p>` : ""}
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Mazo</h2><button id="edit">Cambiar cartas</button></div>
        <div class="row"><span class="pill">${n} jugadores</span><span class="pill">${deck.length} cartas</span><span class="pill ${cls}">${st}</span></div>
        <p class="muted small">Mostrar solo color: ${colorAllowed ? "permitido" : "no permitido"}${S.colorRule === "auto" ? " (según el número de jugadores)" : ""}.</p>
        ${W.w.length ? `<div class="notes">${W.w.map(x => `<span class="w">${esc(x)}</span>`).join("")}</div>` : ""}
        ${started && late ? `<p class="small" style="color:var(--warn)">${late} jugador${late > 1 ? "es" : ""} sin carta. Reparte otra vez para incluirlos.</p>` : ""}
        <button class="primary big" id="deal" ${ok ? "" : "disabled"}>${started ? "Repartir otra vez (nueva partida)" : "Iniciar y repartir"}</button>
        <p class="muted small">${started ? "Al repartir de nuevo, todos reciben una carta nueva al instante." : "Las cartas aparecen solas en el celular de cada jugador."}</p>
      </section>
      ${started ? `<section class="panel">
        <div class="panel-head"><h2>Durante el juego</h2></div>
        ${drunk && game.sober ? `<div class="row"><span>Al empezar la última ronda:</span><button class="primary" id="wake">Despertar al Borracho</button></div>` : ""}
        <label class="small">Intercambiar cartas entre dos jugadores <span class="muted">(Patata caliente, Duende)</span>
          <div class="row">
            <select id="swapA"><option value="">Jugador…</option>${withCard.map(p => `<option value="${esc(p.id)}" ${swapA === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
            <select id="swapB"><option value="">Jugador…</option>${withCard.map(p => `<option value="${esc(p.id)}" ${swapB === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
            <button id="swap">Intercambiar</button>
          </div></label>
        <p class="muted small">Al intercambiar, cada carta llega limpia: se borran las condiciones que habían adquirido.</p>
      </section>` : ""}
      <section class="panel">
        ${confirmEnd ? `<div class="confirm"><span>¿Terminar la partida? Los jugadores ya no verán sus cartas.</span><button id="endYes" class="primary">Sí, terminar</button><button id="endNo">Cancelar</button></div>` : `<button class="ghost" id="end" style="justify-self:start">Terminar partida</button>`}
      </section>
    </div>`;
    $("#home").onclick = () => go(home);
    $("#edit").onclick = () => go(hostSetup, code);
    const rv = $("#reveal"); if (rv) rv.onclick = () => { reveal = !reveal; render(); };
    $$("[data-kick]").forEach(b => b.onclick = async () => { await api.removePlayer(code, b.dataset.kick); toast("Jugador quitado"); });
    $("#deal").onclick = async () => {
      const ids = list.map(p => p.id);
      const full = fillTo(S, ids.length + extraCards(S));
      let pool = shuffle(full);
      // Las cartas que se apartan (enterrada y sobria) nunca son de parejas/tríos ni el propio Borracho.
      const takeAside = () => { const i = pool.findIndex(r => !r.link && r.id !== "borracho"); return i < 0 ? null : pool.splice(i, 1)[0]; };
      const sober = (S.counts.borracho || 0) ? takeAside() : null;
      const buried = S.bury ? takeAside() : null;
      if (pool.length !== ids.length) { toast("No hay suficientes cartas que se puedan apartar"); return; }
      const patches = {}; ids.forEach((id, i) => patches[id] = { card: cardOf(pool[i]), round: (game.round || 0) + 1, acq: [], cured: [], paraUsed: false, peeks: 0 });
      const counts = {}; full.forEach(r => { const k = r.name + "|" + r.color; counts[k] = counts[k] || { name: r.name, color: r.color, n: 0 }; counts[k].n++; });
      await api.batch(code, { round: (game.round || 0) + 1, inPlay: Object.values(counts), buried: buried ? 1 : 0, buriedCard: buried ? cardOf(buried) : null, sober: sober ? cardOf(sober) : null, colorAllowed, timer: newTimer(ids.length >= 11 ? 5 : 3) }, patches);
      toast("Cartas repartidas");
    };
    const setT = patch => api.updateGame(code, { timer: Object.assign({}, T, patch) });
    const tp = $("#tPlay"); if (tp) tp.onclick = () => setT({ state: "run", endsAt: Date.now() + tLeft(T) * 1000 });
    const tz = $("#tPause"); if (tz) tz.onclick = () => setT({ state: "pause", left: tLeft(T) });
    hostNext = T.r < T.n ? () => setT({ r: T.r + 1, state: "idle", endsAt: null, left: T.mins[T.r] * 60 }) : null;
    const tn = $("#tNext"); if (tn) tn.onclick = hostNext;
    const tr = $("#tReset"); if (tr) tr.onclick = () => setT({ state: "idle", endsAt: null, left: T.mins[T.r - 1] * 60 });
    const tm = $("#tMode"); if (tm) tm.onchange = e => api.updateGame(code, { timer: newTimer(+e.target.value) });
    const wk = $("#wake"); if (wk) wk.onclick = async () => { await api.batch(code, { sober: null }, { [drunk.id]: { card: game.sober, acq: [], cured: [], paraUsed: false } }); toast(drunk.name + " ya tiene su carta sobria"); };
    const sa = $("#swapA"), sb = $("#swapB");
    if (sa) { sa.onchange = e => swapA = e.target.value; sb.onchange = e => swapB = e.target.value; }
    const sw = $("#swap"); if (sw) sw.onclick = async () => {
      const A = list.find(p => p.id === swapA), Bp = list.find(p => p.id === swapB);
      if (!A || !Bp || A.id === Bp.id) { toast("Elige dos jugadores distintos"); return; }
      await api.batch(code, null, { [A.id]: { card: Bp.card, acq: [], cured: [], paraUsed: false }, [Bp.id]: { card: A.card, acq: [], cured: [], paraUsed: false } });
      swapA = swapB = ""; toast(`${A.name} y ${Bp.name} intercambiaron cartas`);
    };
    if (confirmEnd) {
      $("#endYes").onclick = async () => { for (const p of list) await api.removePlayer(code, p.id); await api.updateGame(code, { round: 0, ended: true }); ls.set("rs-host", null); go(home); };
      $("#endNo").onclick = () => { confirmEnd = false; render(); };
    } else $("#end").onclick = () => { confirmEnd = true; render(); };
  };
  app().innerHTML = `<div class="narrow"><div class="panel wait"><div class="pulse"></div><p>Abriendo la sala…</p></div></div>`;
  unsubs.push(api.watchGame(code, g => { game = g; gl = true; render(); setTimer(g); }));
  unsubs.push(api.watchPlayers(code, l => { players = l; render(); }));
}

// ---------- arranque ----------
if (ls.get("rs-player")) go(playerView); else go(home);
})();
</script>
