{"id": "ninja-a", "name": "Ninja", "color": "a", "team": "a", "note": "Una vez por partida y en cualquier ronda menos la última, muestra tu carta públicamente, ve a la otra sala y atrapa de inmediato a un jugador: ambos salen del juego (sin morir) y siguen ganando o perdiendo según su objetivo. Si atrapas a alguien inmune, sales tú solo. Si sacas al líder, esa sala elige otro.", "max": 1, "extra": true},
{"id": "ninja-r", "name": "Ninja", "color": "r", "team": "r", "note": "Una vez por partida y en cualquier ronda menos la última, muestra tu carta públicamente, ve a la otra sala y atrapa de inmediato a un jugador: ambos salen del juego (sin morir) y siguen ganando o perdiendo según su objetivo. Si atrapas a alguien inmune, sales tú solo. Si sacas al líder, esa sala elige otro.", "max": 1, "extra": true},
{"id": "flautista-a", "name": "Flautista", "color": "a", "team": "a", "note": "Quien haga co-revelación contigo queda «hechizado»: tiene un objetivo adicional y pierde si al final no está en la misma sala que el Flautista que lo hechizó. Cada jugador solo puede tener una condición «hechizado».", "max": 1, "extra": true},
{"id": "flautista-r", "name": "Flautista", "color": "r", "team": "r", "note": "Quien haga co-revelación contigo queda «hechizado»: tiene un objetivo adicional y pierde si al final no está en la misma sala que el Flautista que lo hechizó. Cada jugador solo puede tener una condición «hechizado».", "max": 1, "extra": true},
{"id": "pirata-a", "name": "Pirata", "color": "a", "team": "a", "note": "Una vez por partida, muestra tu carta públicamente, elige a otro jugador de tu sala y dile en voz alta «¡Arr, al tablón!». Ese jugador queda «expulsado» y debe ser uno de los rehenes de esa ronda (si es la última ronda, es el único rehén). Tu carta queda visible el resto del juego.", "max": 1, "extra": true},
{"id": "pirata-r", "name": "Pirata", "color": "r", "team": "r", "note": "Una vez por partida, muestra tu carta públicamente, elige a otro jugador de tu sala y dile en voz alta «¡Arr, al tablón!». Ese jugador queda «expulsado» y debe ser uno de los rehenes de esa ronda (si es la última ronda, es el único rehén). Tu carta queda visible el resto del juego.", "max": 1, "extra": true},
{"id": "profesor-a", "name": "Profesor", "color": "a", "team": "a", "note": "Quien haga co-revelación contigo queda «astuto»: desde entonces solo puede hacer co-revelaciones de carta completa (no revelaciones privadas ni intercambios de color).", "max": 1, "extra": true},
{"id": "profesor-r", "name": "Profesor", "color": "r", "team": "r", "note": "Quien haga co-revelación contigo queda «astuto»: desde entonces solo puede hacer co-revelaciones de carta completa (no revelaciones privadas ni intercambios de color).", "max": 1, "extra": true},
{"id": "furioso-a", "name": "Furioso", "color": "a", "team": "a", "note": "Tienes un objetivo alternativo: si eres líder, ya elegiste a tus rehenes y estás esperando al otro líder entre rondas, puedes gritar «¡Furioso uno! ¡Furioso dos!…». Si llegas a «¡Furioso diez!» antes de que llegue el otro líder, ganas tú y todos los demás pierden.", "max": 1, "extra": true},
{"id": "furioso-r", "name": "Furioso", "color": "r", "team": "r", "note": "Tienes un objetivo alternativo: si eres líder, ya elegiste a tus rehenes y estás esperando al otro líder entre rondas, puedes gritar «¡Furioso uno! ¡Furioso dos!…». Si llegas a «¡Furioso diez!» antes de que llegue el otro líder, ganas tú y todos los demás pierden.", "max": 1, "extra": true},
{"id": "rata-a", "name": "Rata", "color": "a", "team": "a", "note": "Una vez por partida, muestra tu carta a toda la sala y vete a la otra; tu carta queda visible el resto del juego. En la otra sala eres inmune, no votas y no cuentas para rehenes. Debes volver a tu sala antes de que termine la ronda o pierdes automáticamente.", "max": 1, "extra": true},
{"id": "rata-r", "name": "Rata", "color": "r", "team": "r", "note": "Una vez por partida, muestra tu carta a toda la sala y vete a la otra; tu carta queda visible el resto del juego. En la otra sala eres inmune, no votas y no cuentas para rehenes. Debes volver a tu sala antes de que termine la ronda o pierdes automáticamente.", "max": 1, "extra": true},
{"id": "policia-secreta-a", "name": "Policía secreta", "color": "a", "team": "a", "note": "Objetivo alternativo: entre rondas está prohibido jugar. Si alguien habla del juego o comparte cartas entre rondas, señálalo, muestra tu carta como placa y grita «¡Policía secreta! ¡Estás arrestado!». Si otro jugador confirma que sí estaban jugando, ganas tú y todos los demás pierden. Elegir rehenes después de que acabó el tiempo cuenta como jugar.", "max": 1, "extra": true},
{"id": "policia-secreta-r", "name": "Policía secreta", "color": "r", "team": "r", "note": "Objetivo alternativo: entre rondas está prohibido jugar. Si alguien habla del juego o comparte cartas entre rondas, señálalo, muestra tu carta como placa y grita «¡Policía secreta! ¡Estás arrestado!». Si otro jugador confirma que sí estaban jugando, ganas tú y todos los demás pierden. Elegir rehenes después de que acabó el tiempo cuenta como jugar.", "max": 1, "extra": true},
{"id": "vidente-a", "name": "Vidente", "color": "a", "team": "a", "note": "Después de repartir y antes de empezar, todos cierran los ojos y muestran su carta públicamente unos 30 segundos; solo los Videntes pueden abrir los ojos y caminar para verlas. Empiezas con la condición «tímido».", "max": 1, "extra": true, "conds": ["timido"]},
{"id": "vidente-r", "name": "Vidente", "color": "r", "team": "r", "note": "Después de repartir y antes de empezar, todos cierran los ojos y muestran su carta públicamente unos 30 segundos; solo los Videntes pueden abrir los ojos y caminar para verlas. Empiezas con la condición «tímido».", "max": 1, "extra": true, "conds": ["timido"]},
{"id": "tentaculos-a", "name": "Tentáculos", "color": "a", "team": "a", "note": "Si tu sala tiene menos jugadores que la otra, puedes ir a la otra sala, atrapar de inmediato a un jugador y regresar con él a tu sala. Si atrapas a alguien inmune, atrapa a otro. Puedes hacerlo las veces que quieras, menos en la última ronda. Si atrapas al líder, esa sala elige otro.", "max": 1, "extra": true},
{"id": "tentaculos-r", "name": "Tentáculos", "color": "r", "team": "r", "note": "Si tu sala tiene menos jugadores que la otra, puedes ir a la otra sala, atrapar de inmediato a un jugador y regresar con él a tu sala. Si atrapas a alguien inmune, atrapa a otro. Puedes hacerlo las veces que quieras, menos en la última ronda. Si atrapas al líder, esa sala elige otro.", "max": 1, "extra": true},
{"id": "senor-del-tiempo-a", "name": "Señor del tiempo", "color": "a", "team": "a", "note": "Puedes mostrar tu carta públicamente en cualquier momento y anunciar «¡Se acabó el tiempo!» para terminar la ronda; ambas salas deben oírlo. Si alguna vez tardas más de 5 minutos en terminar una ronda, pierdes el poder.", "max": 1, "extra": true},
{"id": "senor-del-tiempo-r", "name": "Señor del tiempo", "color": "r", "team": "r", "note": "Puedes mostrar tu carta públicamente en cualquier momento y anunciar «¡Se acabó el tiempo!» para terminar la ronda; ambas salas deben oírlo. Si alguna vez tardas más de 5 minutos en terminar una ronda, pierdes el poder.", "max": 1, "extra": true},
{"id": "comerciante-a", "name": "Comerciante", "color": "a", "team": "a", "note": "Puedes cambiar tu carta por la carta enterrada, sin verla antes. Tomas los poderes y el equipo de tu nueva carta. Solo puedes usar este poder una vez por ronda.", "max": 1, "extra": true},
{"id": "comerciante-r", "name": "Comerciante", "color": "r", "team": "r", "note": "Puedes cambiar tu carta por la carta enterrada, sin verla antes. Tomas los poderes y el equipo de tu nueva carta. Solo puedes usar este poder una vez por ronda.", "max": 1, "extra": true},
{"id": "vampiro-a", "name": "Vampiro", "color": "a", "team": "a", "note": "Quien haga co-revelación contigo y tenga un color distinto al tuyo queda «seducido»: debe hacer con su carta lo que le pidas (intercambiar color, revelarla públicamente, etc.) y votar igual que tú para nombrar o destituir líderes.", "max": 1, "extra": true},
{"id": "vampiro-r", "name": "Vampiro", "color": "r", "team": "r", "note": "Quien haga co-revelación contigo y tenga un color distinto al tuyo queda «seducido»: debe hacer con su carta lo que le pidas (intercambiar color, revelarla públicamente, etc.) y votar igual que tú para nombrar o destituir líderes.", "max": 1, "extra": true},
{"id": "miron-a", "name": "Mirón", "color": "a", "team": "a", "note": "Puedes ver la carta enterrada en cualquier momento. No tienes que demostrar que eres el Mirón.", "max": 1, "extra": true},
{"id": "miron-r", "name": "Mirón", "color": "r", "team": "r", "note": "Puedes ver la carta enterrada en cualquier momento. No tienes que demostrar que eres el Mirón.", "max": 1, "extra": true},
{"id": "hombre-lobo-a", "name": "Hombre lobo", "color": "a", "team": "a", "note": "Eres uno de los dos lobos alfa. Quien haga co-revelación o intercambio de color contigo queda «mordido», y quien comparta con un mordido también queda mordido (debe avisar al compartir). Los mordidos deben responder con honestidad cualquier pregunta de cualquiera de los lobos alfa.", "max": 1, "extra": true},
{"id": "hombre-lobo-r", "name": "Hombre lobo", "color": "r", "team": "r", "note": "Eres uno de los dos lobos alfa. Quien haga co-revelación o intercambio de color contigo queda «mordido», y quien comparta con un mordido también queda mordido (debe avisar al compartir). Los mordidos deben responder con honestidad cualquier pregunta de cualquiera de los lobos alfa.", "max": 1, "extra": true},
{"id": "xenocazador-a", "name": "Xenocazador", "color": "a", "team": "a", "note": "Cuando un jugador del equipo azul revele su carta públicamente a toda la sala, puedes darle tu carta de Xenocazador: ese jugador sale del juego junto con tu carta. Tú sigues jugando; lo que sale del juego es tu carta.", "max": 1, "extra": true},
{"id": "xenocazador-r", "name": "Xenocazador", "color": "r", "team": "r", "note": "Cuando un jugador del equipo azul revele su carta públicamente a toda la sala, puedes darle tu carta de Xenocazador: ese jugador sale del juego junto con tu carta. Tú sigues jugando; lo que sale del juego es tu carta.", "max": 1, "extra": true},
{"id": "xenomorfo-a", "name": "Xenomorfo", "color": "a", "team": "a", "note": "El primer jugador del equipo azul que haga co-revelación o intercambio de color contigo queda «embarazado» y le das tu carta de Xenomorfo (no puede usarla ni mostrarla, pero sigue usando la suya). Al final, todos los que estén en la sala de ese jugador quedan «muertos».", "max": 1, "extra": true},
{"id": "xenomorfo-r", "name": "Xenomorfo", "color": "r", "team": "r", "note": "El primer jugador del equipo azul que haga co-revelación o intercambio de color contigo queda «embarazado» y le das tu carta de Xenomorfo (no puede usarla ni mostrarla, pero sigue usando la suya). Al final, todos los que estén en la sala de ese jugador quedan «muertos».", "max": 1, "extra": true},
{"id": "exhibicionista", "name": "Exhibicionista", "color": "r", "team": "r", "note": "Empiezas con la condición «exhibicionista»: solo puedes revelar tu carta públicamente, aunque un poder te obligue a una co-revelación. No puedes hacer co-revelaciones ni revelaciones privadas de tu carta o tu color.", "max": 1, "extra": true, "conds": ["exhibicionista"]},
{"id": "fanatico", "name": "Fanático", "color": "r", "team": "r", "note": "Eres la reserva del Ingeniero del huevo. Si su carta quedó enterrada o muere antes del final, debes cumplir sus responsabilidades (hacer co-revelación con el Dragón).", "max": 1, "extra": true},
{"id": "insensato", "name": "Insensato", "color": "r", "team": "r", "note": "Empiezas con la condición «imprudente»: nunca puedes rechazar una propuesta de co-revelación o de intercambio de color. «Imprudente» y «tímido» se cancelan entre sí.", "max": 1, "extra": true, "conds": ["imprudente"]},
{"id": "fugitivo", "name": "Fugitivo", "color": "r", "team": "r", "note": "Si haces co-revelación con el Manco, el juego termina de inmediato y gana el Equipo Rojo.", "max": 1, "extra": true},
{"id": "gargola", "name": "Gárgola", "color": "r", "team": "r", "note": "Cuando te elijan para salir de la sala (como rehén o por un poder), puedes mostrar tu carta públicamente y decir «Piedra» para no salir; quien te eligió debe escoger a otro. Puedes usarlo las veces que quieras, pero no mientras el líder está fuera durante el encuentro entre rondas.", "max": 1, "extra": true},
{"id": "gorgona", "name": "Gorgona", "color": "r", "team": "r", "note": "Quien haga co-revelación contigo queda «petrificado»: ya no puede votar y, cada vez que haya una votación (nombrar o destituir líder), debe quedarse rígido con los brazos hacia abajo.", "max": 1, "extra": true},
{"id": "puno-rojo", "name": "Puño Rojo", "color": "r", "team": "r", "note": "Eres un personaje principal. El Equipo Rojo gana si al final no estás en la misma sala que el Dron Azul.", "max": 1, "extra": true},
{"id": "pie-rojo", "name": "Pie Rojo", "color": "r", "team": "r", "note": "Eres un personaje secundario: la reserva del Puño Rojo. Si su carta quedó enterrada o muere antes de que se active la bomba, cumples todas sus responsabilidades.", "max": 1, "extra": true},
{"id": "socialista", "name": "Socialista", "color": "r", "team": "r", "note": "Quien haga co-revelación contigo debe cambiar su carta por una de Equipo Rojo antes de la siguiente ronda y antes de mostrarla a nadie más. No afecta a personajes principales, a sus reservas ni a personajes que no sean rojos o azules.", "max": 1, "extra": true},
{"id": "testigo", "name": "Testigo", "color": "r", "team": "r", "note": "Si haces co-revelación con el Alguacil, el juego termina de inmediato y gana el Equipo Rojo.", "max": 1, "extra": true},
{"id": "dragon", "name": "Dragón", "color": "r", "team": "r", "note": "Eres un personaje principal (reemplaza a la Bomba). Al final, todos los que estén en tu sala quedan «tostados». El Equipo Rojo gana si el Rey queda tostado. Si mueres antes del final, no lanzas fuego.", "max": 1, "extra": true},
{"id": "huevo-de-dragon", "name": "Huevo de dragón", "color": "r", "team": "r", "note": "Eres un personaje secundario: la reserva del Dragón. Si su carta quedó enterrada o queda tostado antes del final, cumples todas sus responsabilidades (terminar en la sala del Rey, hacer co-revelación con el Ingeniero del huevo).", "max": 1, "extra": true},
{"id": "ingeniero-del-huevo", "name": "Ingeniero del huevo", "color": "r", "team": "r", "note": "Con el Ingeniero del huevo en juego, el Equipo Rojo tiene un requisito adicional: el Dragón debe hacer co-revelación contigo antes del final o el Equipo Rojo pierde. Al final, ambos confirman si lo hicieron. Si el Dragón cambia de jugador, el nuevo debe compartir de nuevo.", "max": 1, "extra": true},
{"id": "alquimista", "name": "Alquimista", "color": "a", "team": "a", "note": "Con el Alquimista en juego, el Equipo Azul tiene un requisito adicional: el Rey debe hacer co-revelación contigo antes del final o el Equipo Azul pierde. Al final, ambos confirman si lo hicieron. Si el Rey cambia de jugador, el nuevo debe compartir de nuevo.", "max": 1, "extra": true},
{"id": "aprendiz", "name": "Aprendiz", "color": "a", "team": "a", "note": "Eres la reserva del Alquimista. Si su carta quedó enterrada o muere antes del final, cumples sus responsabilidades (hacer co-revelación con el Rey).", "max": 1, "extra": true},
{"id": "petardo-azul", "name": "Petardo Azul", "color": "a", "team": "a", "note": "Eres un personaje secundario: la reserva del Dron Azul. Si su carta quedó enterrada o muere antes del final, cumples todas sus responsabilidades.", "max": 1, "extra": true},
{"id": "capitalista", "name": "Capitalista", "color": "a", "team": "a", "note": "Quien haga co-revelación contigo debe cambiar su carta por una de Equipo Azul antes de la siguiente ronda y antes de mostrarla a nadie más. No afecta a personajes principales, secundarios ni a personajes que no sean rojos o azules.", "max": 1, "extra": true},
{"id": "princesa-gorda", "name": "Princesa gorda", "color": "a", "team": "a", "note": "Eres un personaje secundario: la reserva del Rey. Si su carta quedó enterrada o queda tostado antes del final, cumples todas sus responsabilidades (como hacer co-revelación con el Alquimista).", "max": 1, "extra": true},
{"id": "bombero", "name": "Bombero", "color": "a", "team": "a", "note": "Si haces co-revelación con el Presidente, él queda «a prueba de fuego». Si el Presidente lo está al final, todos los de su sala también, y nadie a prueba de fuego muere por la condición «bomba incendiaria».", "max": 1, "extra": true},
{"id": "rey", "name": "Rey", "color": "a", "team": "a", "note": "Eres un personaje principal (reemplaza al Presidente). El Equipo Azul gana si no quedas «tostado».", "max": 1, "extra": true},
{"id": "alguacil", "name": "Alguacil", "color": "a", "team": "a", "note": "Si haces co-revelación con el Fugitivo, el juego termina de inmediato y gana el Equipo Azul.", "max": 1, "extra": true},
{"id": "manco", "name": "Manco", "color": "a", "team": "a", "note": "Si haces co-revelación con el Testigo, el juego termina de inmediato y gana el Equipo Azul.", "max": 1, "extra": true},
{"id": "pirotecnico", "name": "Pirotécnico", "color": "a", "team": "a", "note": "Si haces co-revelación con la Bomba, le das la condición «bomba incendiaria». Si la Bomba la tiene al final, todos los jugadores quedan «muertos», sin importar en qué sala estén.", "max": 1, "extra": true},
{"id": "lider-nato", "name": "Líder nato", "color": "g", "team": "g", "note": "Ganas si al final eres líder de una sala.", "max": 1, "extra": true},
{"id": "cambiante", "name": "Cambiante", "color": "g", "team": "g", "note": "Se arma un «mazo de diversión» con cartas que no se usan. Antes del final debes cambiar tu carta por una al azar de ese mazo (solo una vez, salvo que te salga otro Cambiante). La nueva carta llega limpia. Si no lo haces a tiempo, no cumples tu objetivo.", "max": 1, "extra": true},
{"id": "lider-de-secta", "name": "Líder de secta", "color": "g", "team": "g", "note": "Empiezas con la condición «sectario». Quien haga co-revelación o intercambio de color con un sectario también se vuelve sectario (debe avisar al compartir). Los sectarios pierden si el Líder de secta muere, y si muere, ellos también mueren.", "max": 1, "extra": true, "conds": ["sectario"]},
{"id": "padre", "name": "Padre", "color": "g", "team": "g", "note": "En la primera ronda debes revelar tu carta en privado a 2 jugadores y decirles «Ustedes son mis hijos» (no tiene que ser al mismo tiempo). Ganas si esos 2 jugadores terminan en la misma sala que el Presidente.", "max": 1, "extra": true},
{"id": "toqueton", "name": "Toquetón", "color": "g", "team": "g", "note": "Pierdes si al final no tocaste a todos los jugadores. También pierdes si la Mojigata te agarra de la muñeca.", "max": 1, "extra": true, "link": "toqueton"},
{"id": "equipo-gris", "name": "Equipo Gris", "color": "g", "team": "g", "note": "Antes de que termine la última ronda debes cambiar tu carta por una de Equipo Rojo o de Equipo Azul (de las que sobran) y tomas ese equipo. Si no lo haces a tiempo, no cumples tu objetivo.", "max": 1, "extra": true},
{"id": "heroe", "name": "Héroe", "color": "g", "team": "g", "note": "Ganas si al final estás en la misma sala que el Presidente y la Bomba. Si ganas, pierden tanto el Equipo Rojo como el Azul.", "max": 1, "extra": true},
{"id": "illuminati", "name": "Illuminati", "color": "g", "team": "g", "note": "Tu carta tiene un lado rojo y uno azul; puedes mostrar cualquiera al intercambiar color o revelar. Si cualquier jugador hace co-revelación contigo, ganas tú y todos los demás pierden.", "max": 1, "extra": true},
{"id": "juez", "name": "Juez", "color": "g", "team": "g", "note": "Si alguien te revela su carta en privado y te dice «Toma mi carta», debes quedártela (no puedes usarla ni mostrarla). Si al final rojos y azules empatan, cuenta las cartas rojas y azules que tienes: gana el equipo que te dio más. Ganas si usas este poder, aunque vuelva a haber empate.", "max": 1, "extra": true},
{"id": "madre", "name": "Madre", "color": "g", "team": "g", "note": "En la primera ronda debes revelar tu carta en privado a 2 jugadores y decirles «Ustedes son mis hijos». Ganas si ninguno de los 2 muere; si uno de ellos es la Bomba, solo necesitas que el otro no muera.", "max": 1, "extra": true},
{"id": "papel", "name": "Papel", "color": "g", "team": "g", "note": "Ganas si al final estás en la misma sala que la Piedra, pero no en la misma sala que las Tijeras.", "max": 1, "extra": true, "link": "piedra"},
{"id": "mojigata", "name": "Mojigata", "color": "g", "team": "g", "note": "Ganas si agarras de la muñeca al Toquetón antes del final. Solo puedes agarrar la muñeca de un jugador en toda la partida y no puedes soltarla; ninguno de los dos puede ser rehén sin el otro.", "max": 1, "extra": true, "link": "toqueton"},
{"id": "piedra", "name": "Piedra", "color": "g", "team": "g", "note": "Ganas si al final estás en la misma sala que las Tijeras, pero no en la misma sala que el Papel.", "max": 1, "extra": true, "link": "piedra"},

function firebaseApi(cfg) {
  firebase.initializeApp(cfg);
  const fs = firebase.firestore();
  const G = code => fs.collection("games").doc(code);
  const P = code => G(code).collection("players");
  const onErr = e => { console.error(e); toast("Sin conexión con la base de datos"); };
  return {
    demo: false,
    async getGame(code) { const s = await G(code).get(); return s.exists ? s.data() : null; },
    createGame: (code, data) => G(code).set(clean(data)),
    updateGame: (code, patch) => G(code).update(clean(patch)),
    watchGame: (code, cb) => G(code).onSnapshot(s => cb(s.exists ? s.data() : null), onErr),
    watchPlayers: (code, cb) => P(code).onSnapshot(q => cb(q.docs.map(d => ({ id: d.id, ...d.data() }))), onErr),
    watchPlayer: (code, pid, cb) => P(code).doc(pid).onSnapshot(s => cb(s.exists ? { id: s.id, ...s.data() } : null), onErr),
    async listPlayers(code) { const q = await P(code).get(); return q.docs.map(d => ({ id: d.id, ...d.data() })); },
    async addPlayer(code, data) { const id = rid(); await P(code).doc(id).set(clean(data)); return id; },
    updatePlayer: (code, pid, patch) => P(code).doc(pid).update(clean(patch)),
    removePlayer: (code, pid) => P(code).doc(pid).delete(),
    async batch(code, gamePatch, playerPatches) {
      const b = fs.batch();
      if (gamePatch) b.update(G(code), clean(gamePatch));
      Object.entries(playerPatches).forEach(([pid, p]) => b.update(P(code).doc(pid), clean(p)));
      await b.commit();
    },
    async listTemplates() { const q = await fs.collection("templates").get(); return q.docs.map(d => ({ id: d.id, ...d.data() })); },
    async saveTemplate(t) { const id = rid(); await fs.collection("templates").doc(id).set(clean(t)); return id; },
    deleteTemplate: id => fs.collection("templates").doc(id).delete(),
    async listGames() { const q = await fs.collection("games").get(); return q.docs.map(d => ({ code: d.id, ...d.data() })); },
    async deleteGame(code) { const q = await P(code).get(); const b = fs.batch(); q.docs.forEach(d => b.delete(d.ref)); b.delete(G(code)); await b.commit(); }
  };
}
function localApi() {
  const K = "rs-demo-db";
  const read = () => ls.get(K) || { games: {}, templates: {} };
  const subs = new Set();
  const fire = () => subs.forEach(f => f());
  const bc = "BroadcastChannel" in window ? new BroadcastChannel(K) : null;
  if (bc) bc.onmessage = fire;
  window.addEventListener("storage", e => { if (e.key === K) fire(); });
  const write = db => { ls.set(K, db); if (bc) bc.postMessage(1); fire(); };
  const gameOf = g => { if (!g) return null; const { players, ...rest } = g; return clean(rest); };
  const plist = g => g ? Object.entries(g.players || {}).map(([id, p]) => ({ id, ...p })) : [];
  const watch = (get, cb) => { let last; const f = () => { const v = get(read()); const k = JSON.stringify(v); if (k !== last) { last = k; cb(v); } }; subs.add(f); setTimeout(f); return () => subs.delete(f); };
  return {
    demo: true,
    async getGame(code) { return gameOf(read().games[code]); },
    async createGame(code, data) { const db = read(); db.games[code] = { ...clean(data), players: {} }; write(db); },
    async updateGame(code, patch) { const db = read(); Object.assign(db.games[code], clean(patch)); write(db); },
    watchGame: (code, cb) => watch(db => gameOf(db.games[code]), cb),
    watchPlayers: (code, cb) => watch(db => plist(db.games[code]), cb),
    watchPlayer: (code, pid, cb) => watch(db => { const p = db.games[code]?.players?.[pid]; return p ? { id: pid, ...p } : null; }, cb),
    async listPlayers(code) { return plist(read().games[code]); },
    async addPlayer(code, data) { const db = read(); const id = rid(); db.games[code].players[id] = clean(data); write(db); return id; },
    async updatePlayer(code, pid, patch) { const db = read(); const p = db.games[code]?.players?.[pid]; if (p) { Object.assign(p, clean(patch)); write(db); } },
    async removePlayer(code, pid) { const db = read(); delete db.games[code].players[pid]; write(db); },
    async batch(code, gamePatch, playerPatches) { const db = read(); const g = db.games[code]; if (gamePatch) Object.assign(g, clean(gamePatch)); Object.entries(playerPatches).forEach(([pid, p]) => { if (g.players[pid]) Object.assign(g.players[pid], clean(p)); }); write(db); },
    async listTemplates() { return Object.entries(read().templates).map(([id, t]) => ({ id, ...t })); },
    async saveTemplate(t) { const db = read(); const id = rid(); db.templates[id] = clean(t); write(db); return id; },
    async deleteTemplate(id) { const db = read(); delete db.templates[id]; write(db); },
    async listGames() { return Object.entries(read().games).map(([code, g]) => ({ code, ...gameOf(g) })); },
    async deleteGame(code) { const db = read(); delete db.games[code]; write(db); }
  };
}

}

  const slot = (t.n === 5 ? [5, 4, 3, 2, 1] : [3, 2, 1])[t.r - 1], p = t.players || 0;
  if (!slot || p < 6) return 1;
  const row = p <= 10 ? { 3: 1, 2: 1, 1: 1 } : p <= 13 ? { 5: 2, 4: 2, 3: 2, 2: 1, 1: 1 } : p <= 17 ? { 5: 3, 4: 2, 3: 2, 2: 1, 1: 1 } : p <= 21 ? { 5: 4, 4: 3, 3: 2, 2: 1, 1: 1 } : { 5: 5, 4: 4, 3: 3, 2: 2, 1: 1 };

// ---------- reglas para mostrar la carta ----------
// Devuelve las condiciones activas y qué puede mostrar el jugador por voluntad propia.
function rulesFor(card, me) {
  const innate = (card.conds || []).filter(c => !(me.cured || []).includes(c));
  const immune = innate.includes("inmune");
  const set = new Set(innate.concat(immune ? [] : (me.acq || [])));
  if (set.has("honesto") && set.has("mentiroso")) { set.delete("honesto"); set.delete("mentiroso"); }
  if (set.has("enamorado") && set.has("odio")) { set.delete("enamorado"); set.delete("odio"); }
  if (set.has("imprudente")) ["timido", "discreto", "paranoico"].forEach(c => { if (set.has(c)) { set.delete(c); set.delete("imprudente"); } });
  let can = { color: true, role: true, full: true };
  const only = keys => Object.keys(can).forEach(k => { if (!keys.includes(k)) can[k] = false; });
  if (set.has("timido")) only([]);
  if (set.has("discreto")) only(["color"]);
  if (set.has("astuto")) only(["full"]);
  if (set.has("exhibicionista")) only(["full"]);
  if (set.has("sincarta")) only([]);
  if (set.has("desgarrado")) only(["full"]);
  if (set.has("paranoico")) { only(["full"]); if (me.paraUsed) can.full = false; }
  return { set, can, immune };
}

    const ab = $("#addCondBtn"); if (ab) ab.onclick = () => { const k = $("#addCond").value; if (k) api.updatePlayer(ps.code, ps.pid, { acq: [...new Set([...(me.acq || []), k])], cured: (me.cured || []).filter(x => x !== k) }); };
    const md = $("#medic"); if (md) md.onclick = () => { api.updatePlayer(ps.code, ps.pid, { acq: [] }); toast("Condiciones adquiridas quitadas"); };
    const py = $("#psych"); if (py) py.onclick = () => {
      const psy = Object.keys(COND).filter(k => COND[k].psy);
      api.updatePlayer(ps.code, ps.pid, { acq: (me.acq || []).filter(k => !psy.includes(k)), cured: [...new Set([...(me.cured || []), ...(c.conds || []).filter(k => psy.includes(k))])] });
      toast("Condiciones psicológicas quitadas");
    };
    $("#leave").onclick = () => go(home);
  };
  app().innerHTML = `<div class="narrow"><div class="panel wait"><div class="pulse"></div><p>Cargando tu partida…</p></div></div>`;
  // Pantalla del final: reunirse, responder antes de revelar y ver resultados.
  let endKeyLast = "", endHidden = "";
  const renderEnd = () => {
    let ov = $("#endscreen");
    if (!game || !me || !game.endPhase) { if (ov) ov.remove(); endKeyLast = ""; return; }
    autoReveal(ps.code, game, players);
    const qs = endQuestions(game, players, me), ans = me.endAns || {};
    const left = game.endPhase === "done" ? countdownLeft(game) : 0;
    const waitRoles = game.endPhase === "pre" ? [...new Set(pendingEnd(game, players).filter(p => p.id !== me.id).map(p => p.card.name))] : [];
    const k = JSON.stringify([game.endPhase, game.result, left > 0 ? left : 0, ans, qs.map(q => q.k), waitRoles, players.map(p => [p.id, p.room, p.card?.id])]);
    if (k === endKeyLast && ov) return; endKeyLast = k;
    if (!ov) { ov = document.createElement("div"); ov.id = "endscreen"; ov.setAttribute("role", "dialog"); document.body.appendChild(ov); try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) {} }
    if (game.endPhase === "done") {
      if (left > 0) { ov.innerHTML = `<div class="endbox">${countdownHTML(left)}</div>`; if (left === 1) { try { navigator.vibrate && navigator.vibrate(400); } catch (e) {} } return; }
      if (endHidden === JSON.stringify(game.result)) { ov.remove(); return; }
      ov.innerHTML = `<div class="endbox">${resultHTML(game, players, me.id)}<button type="button" class="ghost" id="endClose">Cerrar</button></div>`;
      $("#endClose", ov).onclick = () => { endHidden = JSON.stringify(game.result); ov.remove(); };
      return;
    }
    const pending = qs.filter(q => ans[q.k] == null);
    ov.innerHTML = `<div class="endbox">
      <span class="eyebrow">Fin del juego</span><h1>Reúnanse</h1>
      <p>Júntense todos en un mismo lugar, <b>sin mezclarse</b>: el Cuarto 1 de un lado y el Cuarto 2 del otro.${me.room ? ` Tú vas con el <b>Cuarto ${esc(me.room)}</b>.` : ""}</p>
      ${pending.length ? pending.slice(0, 1).map(q => `<div class="panel endq"><b>${esc(q.q)}</b>${q.note ? `<p class="muted small">${esc(q.note)}</p>` : ""}<div class="names">${q.opts.map(([v, l]) => `<button type="button" data-ans="${esc(q.k)}" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div><p class="muted small">Solo tú ves esta pregunta.</p></div>`).join("")
        : `<div class="panel wait"><div class="pulse"></div>${waitRoles.length ? `<p><b>Esperando acción de:</b></p><div class="chips">${waitRoles.map(r => `<span class="chip"><span>${esc(r)}</span></span>`).join("")}</div>` : `<p><b>Listo.</b> Calculando el resultado…</p>`}</div>`}
    </div>`;
    $$("[data-ans]", ov).forEach(b => b.onclick = () => api.updatePlayer(ps.code, ps.pid, { endAns: { ...(me.endAns || {}), [b.dataset.ans]: b.dataset.v } }));
  };
  const endTick = setInterval(() => { if (game && game.endPhase === "done" && game.revealAt && game.revealAt > Date.now() - 1500) renderEnd(); }, 250); unsubs.push(() => clearInterval(endTick));
  unsubs.push(() => { const ov = $("#endscreen"); if (ov) ov.remove(); });
  const pwTimer = setInterval(() => renderPower(), 2000); unsubs.push(() => clearInterval(pwTimer));
  // Mantener la pantalla encendida mientras se juega (si el celular lo permite).
  let wake = null; const askWake = async () => { try { if ("wakeLock" in navigator && !document.hidden) wake = await navigator.wakeLock.request("screen"); } catch (e) {} };
  askWake(); const onVis = () => { if (!document.hidden) askWake(); }; document.addEventListener("visibilitychange", onVis);
  unsubs.push(() => { document.removeEventListener("visibilitychange", onVis); try { wake && wake.release(); } catch (e) {} });
  unsubs.push(api.watchGame(ps.code, g => { game = g; loaded.g = true; setTimer(g); render(); renderRoom(); renderShare(); renderPower(); renderEnd(); }));
  unsubs.push(api.watchPlayer(ps.code, ps.pid, p => { me = p; loaded.m = true; render(); renderRoom(); renderShare(); renderPower(); renderEnd(); }));
  unsubs.push(api.watchPlayers(ps.code, list => { players = list; render(); renderRoom(); renderShare(); renderPower(); renderEnd(); }));
}

// ---------- mazo ----------
const allRoles = B => CATALOG.concat(B.custom || []);
function expand(B) { const out = []; allRoles(B).forEach(r => { for (let i = 0; i < (B.counts[r.id] || 0); i++) out.push(r); }); return out; }
function tcount(list) { const c = { a: 0, r: 0, g: 0, v: 0, x: 0 }; list.forEach(r => c[r.team]++); return c; }
const extraCards = B => (B.bury ? 1 : 0) + ((B.counts.borracho || 0) ? 1 : 0);
function fillTo(B, target) {
  const deck = expand(B).slice();
  if (!B.autofill) return deck;
  const tc = tcount(deck);
  const A = byId("azul"), R = byId("rojo"), J = byId("jugador");
  while (deck.length < target) {
    const left = target - deck.length;
    if (left === 1 && tc.a === tc.r && B.gamblerOdd && !deck.some(r => r.id === "jugador")) { deck.push(J); tc.g++; continue; }
    const r = tc.a <= tc.r ? A : R; tc[r.team]++; deck.push(r);
  }
  return deck;
}
function deckWarnings(B) {
  const has = id => (B.counts[id] || 0) > 0;
  const w = [], i = [];
  if (!has("presidente") && !has("hija-del-presidente")) w.push("Falta el Presidente.");
  if (!has("bomba") && !has("martir")) w.push("Falta la Bomba.");
  Object.values(LINK_NAMES).forEach(g => { const inn = g.filter(has); if (inn.length && inn.length < g.length) w.push(`${inn.map(id => byId(id).name).join(", ")} necesita${inn.length > 1 ? "n" : ""} a ${g.filter(id => !has(id)).map(id => byId(id).name).join(" y ")}.`); });
  const seen = new Set();
  Object.keys(PAIRS).forEach(id => { if (seen.has(id) || LINK_NAMES[id] || Object.values(LINK_NAMES).some(g => g.includes(id))) return; const o = PAIRS[id][0]; seen.add(id); seen.add(o);
    if ((B.counts[id] || 0) !== (B.counts[o] || 0)) i.push(`${byId(id).name} ${COLOR[byId(id).color].toLowerCase()} y ${byId(o).name} ${COLOR[byId(o).color].toLowerCase()} no están parejos.`); });
  if (has("detective") && !B.bury) w.push("Detective necesita jugar con carta enterrada.");
  if (["hija-del-presidente", "martir", "enfermera", "mecanico"].some(has) && !B.bury) i.push("Hija del presidente, Mártir, Enfermera y Mecánico son reservas para jugar con carta enterrada.");
  if (has("enfermera") && !has("doctor")) i.push("Enfermera es reserva del Doctor.");
  if (has("mecanico") && !has("ingeniero")) i.push("Mecánico es reserva del Ingeniero.");
  if (has("borracho")) i.push("Se apartará una carta sobria para el Borracho. Desde la sala lo despiertas al empezar la última ronda.");
  if (B.bury) i.push("Se reparte una carta de más y una queda enterrada al azar (nunca una de los personajes que juegan en pareja o trío).");
  return { w, i };
}

    applyFilter();
  }
  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
  render(); loadT();
}

// ---------- anfitrión: sala ----------
function hostLobby() {
  const hs = ls.get("rs-host"); if (!hs) return go(home);
  const code = hs.code;
  let game, players = [], gl = false, reveal = false, confirmEnd = false, swapA = "", swapB = "";
  const render = () => {
    if (!gl) return;
    if (!game) { ls.set("rs-host", null); return go(home, "Esa partida ya no existe."); }
    const list = players.slice().sort((a, b) => a.joinedAt - b.joinedAt);
    const n = list.length, S = game.setup;
    const target = n + extraCards(S);
    const deck = fillTo(S, target);
    const started = game.round > 0;
    const late = list.filter(p => !(p.card && p.round === game.round)).length;
    const W = deckWarnings(S);
    let st, cls = "ok", ok = false;
    if (n < 2) { st = "Esperando jugadores"; cls = "warn"; }
    else if (deck.length < target) { st = `Faltan ${target - deck.length} cartas`; cls = "warn"; }
    else if (deck.length > target) { st = `Sobran ${deck.length - target} cartas: quita algunas o espera más jugadores`; cls = "warn"; }
    else { st = "Listo para repartir"; ok = true; }
    const colorAllowed = S.colorRule === "always" || (S.colorRule !== "never" && n >= 11);
    const drunk = list.find(p => p.card && p.round === game.round && p.card.id === "borracho");
    const withCard = list.filter(p => p.card && p.round === game.round);
    const url = location.href.split("#")[0];
    const T = game.timer || newTimer("basic", n);
    const R0 = endRoles(game, list);
    const pend = game.endPhase === "pre" ? R0.list.filter(p => endQuestions(game, list, p).some(q => (p.endAns || {})[q.k] == null)) : [];
    app().innerHTML = `<div class="wrap">
      <button class="ghost" id="home" style="justify-self:start">← Inicio</button>
      ${demoNote()}
      <section class="panel lobby-head">
        <span class="eyebrow">Código de la partida</span>
        <div class="bigcode">${esc(code)}</div>
        <p class="muted">Que cada quien abra <b style="color:var(--fg);overflow-wrap:anywhere">${esc(url)}</b> en su celular y escriba este código.</p>
        ${started ? `<span class="pill ok">Reparto ${game.round} hecho</span>` : ""}
      </section>
      ${!started ? `<section class="panel tpanel">
        <div class="panel-head"><h2>Temporizador</h2></div>
        <button class="primary big" disabled>▶ Iniciar ronda 1</button>
        <p class="muted small">Primero reparte las cartas (más abajo, botón «Iniciar y repartir»). Después aquí inicias cada ronda y a todos les aparece el reloj arriba de la pantalla.</p>
      </section>` : ""}
      ${started && T ? `<section class="panel tpanel">
        <div class="panel-head"><h2>Temporizador</h2><span class="count">Ronda ${T.r} de ${T.n}</span></div>
        <div class="row">
          ${T.state === "run" ? `<button class="primary big" id="tPause">⏸ Pausar</button>` : `<button class="primary big" id="tPlay">▶ ${T.state === "pause" ? "Reanudar" : "Iniciar ronda " + T.r}</button>`}
          ${T.r < T.n ? `<button id="tNext">Siguiente ronda →</button>` : ""}
          <button class="ghost" id="tReset">Reiniciar esta ronda</button>
        </div>
        <p class="small">Al final de esta ronda cada líder envía <b>${hostTxt(T)}</b>.</p>
        <label for="tMode" class="small">Rondas
          <select id="tMode">
            ${Object.entries(TIMER_MODES).map(([k, m]) => `<option value="${k}" ${(T.mode || "basic") === k ? "selected" : ""} ${m.min && n < m.min ? "disabled" : ""}>${m.label}</option>`).join("")}
          </select></label>
        <p class="muted small">El reloj aparece arriba en el celular de todos. Al llegar a cero, a todos les sale el aviso con los pasos del fin de ronda. Según el reglamento, se juegan 3 rondas; 5 rondas solo con 11 jugadores o más.</p>
      </section>` : ""}
      ${started ? `<section class="panel">
        <div class="panel-head"><h2>Cuartos</h2><button class="ghost" id="reroom">Reacomodar al azar</button></div>
        <div class="rooms">${ROOMS.map(r => { const st = roomState(game, list, r); return `<div class="roomcol"><h3>Cuarto ${r} <span class="count">${st.members.length}</span></h3>
          <ul class="plist">${st.members.map(p => `<li><span class="dot"></span><div style="min-width:0"><div class="nm">${p.id === st.leader ? "👑 " : ""}${esc(p.name)}</div>${st.tally[p.id] && p.id !== st.leader ? `<div class="rl">${st.tally[p.id]} de ${st.need} votos</div>` : ""}</div><div class="row">${p.id === st.leader ? "" : `<button type="button" class="ghost" data-lead="${esc(p.id)}" aria-label="Hacer líder a ${esc(p.name)}">👑</button>`}<button type="button" class="ghost" data-move="${esc(p.id)}" aria-label="Mover a ${esc(p.name)} al otro cuarto">⇄</button></div></li>`).join("")}</ul>
          <p class="small muted">${st.leader ? "" : "Sin líder. "}${st.picks ? "Rehenes anunciados ✓" : "Rehenes: pendientes"}</p></div>`; }).join("")}</div>
        <p class="muted small">Cada jugador ve su cuarto en su celular. Ahí nombran líder, votan para cambiarlo y el líder anuncia sus rehenes; cuando los dos líderes anuncian, la página cambia de cuarto a los rehenes. Con 👑 pones líder tú y con ⇄ mueves a alguien de cuarto (por ejemplo, por el poder de una carta).</p>
      </section>` : ""}
      <section class="panel">
        <div class="panel-head"><h2>Jugadores</h2>
          <div class="row">${started ? `<button class="ghost" id="reveal">${reveal ? "Ocultar cartas" : "Ver qué le tocó a cada uno"}</button>` : ""}<span class="count">${n} dentro</span></div></div>
        ${n ? `<ul class="plist">${list.map(p => { const has = p.card && p.round === game.round; return `<li><span class="dot ${reveal && has ? p.card.color : ""}"></span><div style="min-width:0"><div class="nm">${esc(p.name)}</div>${started ? `<div class="rl">${has ? (p.room ? `Cuarto ${p.room} · ` : "") + (reveal ? esc(p.card.name) : "Tiene carta") + (p.peeks ? ` · volvió a ver su carta ${p.peeks} ${p.peeks > 1 ? "veces" : "vez"}` : "") : "Sin carta, entra en el próximo reparto"}</div>` : ""}</div><button class="x2" data-kick="${esc(p.id)}" aria-label="Quitar a ${esc(p.name)}">×</button></li>`; }).join("")}</ul>` : `<div class="wait"><div class="pulse"></div><p class="muted">Todavía no entra nadie. Comparte el código.</p></div>`}
        ${started && reveal && (game.buriedCard || game.sober) ? `<p class="small muted">${game.buriedCard ? `Carta enterrada: <b style="color:var(--fg)">${esc(game.buriedCard.name)}</b>. ` : ""}${game.sober ? `Carta sobria del Borracho: <b style="color:var(--fg)">${esc(game.sober.name)}</b>.` : ""}</p>` : ""}
      </section>
      ${started && game.arrest ? `<section class="panel"><div class="panel-head"><h2>Policía secreta</h2></div>
        <p class="small"><b>${esc(game.arrest.byName)}</b> arrestó a <b>${esc(game.arrest.targetName)}</b> por jugar entre rondas. Si otro jugador confirma que sí estaba jugando, gana la Policía secreta y todos los demás pierden.</p>
        <div class="row"><button class="primary" id="arrestYes">Sí, alguien lo confirma</button><button id="arrestNo">No, nadie lo confirma</button></div></section>` : ""}
      ${started ? `<section class="panel endpanel">
        <div class="panel-head"><h2>Final del juego</h2></div>
        ${!game.endPhase ? `<p class="small">Después del último intercambio de rehenes, toca <b>Iniciar el final</b>: a todos les pide reunirse sin mezclar los cuartos y a los que deben anunciar algo (Jugador, Detective, Francotirador…) les pregunta en su celular. Lo que depende de co-revelaciones (Presidente y Doctor, Bomba e Ingeniero, MI6…) sale del registro de los códigos.</p>
          <button class="primary big" id="endStart">Iniciar el final</button>
          <details><summary class="small">Terminar ya con un ganador (Dr. Boom, Caballero Martes, otra versión del juego…)</summary><div class="row"><button type="button" data-force="a">Ganó el Equipo Azul</button><button type="button" data-force="r">Ganó el Equipo Rojo</button></div></details>`
        : game.endPhase === "pre" ? `${pend.length ? `<p class="small">Esperando acción de: <b>${pend.map(p => `${esc(p.name)} (${esc(p.card.name)})`).join(", ")}</b>. En cuanto respondan, a todos les sale la cuenta regresiva y el resultado.</p>` : `<p class="small">Calculando el resultado…</p>`}
          <div class="row"><button id="endReveal">Revelar ya, sin esperar</button><button class="ghost" id="endCancel">Cancelar el final</button></div>
          ${R0.pres && R0.bomb ? "" : `<p class="small" style="color:var(--warn)">No encuentro Presidente y Bomba: elige quién ganó.</p><div class="row"><button type="button" data-force="a">Ganó el Equipo Azul</button><button type="button" data-force="r">Ganó el Equipo Rojo</button></div>`}`
        : countdownLeft(game) > 0 ? countdownHTML(countdownLeft(game)) : `${resultHTML(game, list, null)}<button class="ghost" id="endCancel">Ocultar resultados</button>`}
      </section>` : ""}
      <section class="panel">
        <div class="panel-head"><h2>Mazo</h2><button id="edit">Cambiar cartas</button></div>
        <div class="row"><span class="pill">${n} jugadores</span><span class="pill">${deck.length} cartas</span><span class="pill ${cls}">${st}</span></div>
        <p class="muted small">Mostrar solo color: ${colorAllowed ? "permitido" : "no permitido"}${S.colorRule === "auto" ? " (según el número de jugadores)" : ""}.</p>
        ${W.w.length ? `<div class="notes">${W.w.map(x => `<span class="w">${esc(x)}</span>`).join("")}</div>` : ""}
        ${started && late ? `<p class="small" style="color:var(--warn)">${late} jugador${late > 1 ? "es" : ""} sin carta. Reparte otra vez para incluirlos.</p>` : ""}
        <button class="primary big" id="deal" ${ok ? "" : "disabled"}>${started ? "Repartir otra vez (nueva partida)" : "Iniciar y repartir"}</button>
        <p class="muted small">${started ? "Al repartir de nuevo, todos reciben una carta nueva al instante." : "Las cartas aparecen solas en el celular de cada jugador."}</p>
      </section>
      ${started ? `<section class="panel">
        <div class="panel-head"><h2>Durante el juego</h2></div>
        ${drunk && game.sober ? `<div class="row"><span>Al empezar la última ronda (se despierta solo al iniciar el reloj de esa ronda):</span><button class="primary" id="wake">Despertar al Borracho</button></div>` : ""}
        <label class="small">Intercambiar cartas entre dos jugadores <span class="muted">(Patata caliente, Duende)</span>
          <div class="row">
            <select id="swapA"><option value="">Jugador…</option>${withCard.map(p => `<option value="${esc(p.id)}" ${swapA === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
            <select id="swapB"><option value="">Jugador…</option>${withCard.map(p => `<option value="${esc(p.id)}" ${swapB === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
            <button id="swap">Intercambiar</button>
          </div></label>
        <p class="muted small">Al intercambiar, cada carta llega limpia: se borran las condiciones que habían adquirido.</p>
      </section>` : ""}
      <section class="panel">
        ${confirmEnd ? `<div class="confirm"><span>¿Terminar la partida? Los jugadores ya no verán sus cartas.</span><button id="endYes" class="primary">Sí, terminar</button><button id="endNo">Cancelar</button></div>` : `<button class="ghost" id="end" style="justify-self:start">Terminar partida</button>`}
      </section>
    </div>`;
    $("#home").onclick = () => go(home);
    $("#edit").onclick = () => go(hostSetup, code);
    const rv = $("#reveal"); if (rv) rv.onclick = () => { reveal = !reveal; render(); };
    $$("[data-kick]").forEach(b => b.onclick = async () => { await api.removePlayer(code, b.dataset.kick); toast("Jugador quitado"); });
    $("#deal").onclick = async () => {
      const ids = list.map(p => p.id);
      const full = fillTo(S, ids.length + extraCards(S));
      let pool = shuffle(full);
      // Las cartas que se apartan (enterrada y sobria) nunca son de parejas/tríos ni el propio Borracho.
      const takeAside = () => { const i = pool.findIndex(r => !r.link && r.id !== "borracho"); return i < 0 ? null : pool.splice(i, 1)[0]; };
      const sober = (S.counts.borracho || 0) ? takeAside() : null;
      const buried = S.bury ? takeAside() : null;
      if (pool.length !== ids.length) { toast("No hay suficientes cartas que se puedan apartar"); return; }
      const order = shuffle(ids), half = Math.ceil(ids.length / 2);
      const roomFor = id => order.indexOf(id) < half ? "1" : "2";
      const patches = {}; ids.forEach((id, i) => patches[id] = { card: cardOf(pool[i]), round: (game.round || 0) + 1, acq: [], cured: [], paraUsed: false, peeks: 0, room: roomFor(id), vote: null, endAns: null, offer: null, shares: [], lastShare: null, piper: null, xenoUsed: false, pUsed: null, pGame: null, publicCard: false, moves: 0, hostageTimes: 0, ledRooms: [], usurpRounds: [], sawUsurp: false, tackled: null, blasted: null, stone: null, ratAway: null, ratLost: false, kids: null, predict: null, taken: [], loveWith: null, hateWith: null, centipede: null, out: false, lastSwap: 0, pubOpen: false, ask: null, interAns: null, timeLost: false });
      const counts = {}; full.forEach(r => { const k = r.name + "|" + r.color; counts[k] = counts[k] || { name: r.name, color: r.color, n: 0 }; counts[k].n++; });
      await api.batch(code, { round: (game.round || 0) + 1, inPlay: Object.values(counts), buried: buried ? 1 : 0, buriedCard: buried ? cardOf(buried) : null, sober: sober ? cardOf(sober) : null, colorAllowed, leader1: null, leader2: null, picks1: null, picks2: null, offer1: null, offer2: null, swaps: 0, endPhase: null, result: null, revealAt: null, lock1: null, lock2: null, lastSwapIn: null, arrest: null, timer: newTimer((TIMER_MODES[game.timer?.mode]?.min || 0) > ids.length ? "basic" : game.timer?.mode, ids.length) }, patches);
      toast("Cartas repartidas");
    };
    const setT = patch => api.updateGame(code, { timer: Object.assign({}, T, patch) });
    const tp = $("#tPlay"); if (tp) tp.onclick = () => setT({ state: "run", endsAt: Date.now() + tLeft(T) * 1000 });
    const tz = $("#tPause"); if (tz) tz.onclick = () => setT({ state: "pause", left: tLeft(T) });
    hostNext = T.r < T.n ? () => setT({ r: T.r + 1, state: "idle", endsAt: null, left: T.mins[T.r] * 60 }) : null;
    const tn = $("#tNext"); if (tn) tn.onclick = hostNext;
    const tr = $("#tReset"); if (tr) tr.onclick = () => setT({ state: "idle", endsAt: null, left: T.mins[T.r - 1] * 60 });
    const tm = $("#tMode"); if (tm) tm.onchange = e => api.updateGame(code, { timer: newTimer(e.target.value, n) });
    if (started && game.picks1 && game.picks2) doExchange(code, game, list);
    if (started) ROOMS.forEach(r => promoteIfMajority(code, game, list, r));
    // El Borracho despierta solo al empezar la última ronda.
    if (started && drunk && game.sober && game.timer && game.timer.r >= game.timer.n && game.timer.state === "run") api.batch(code, { sober: null }, { [drunk.id]: { card: game.sober, acq: [], cured: [], paraUsed: false } });
    // Ciempiés: el enganchado que queda en otro cuarto pasa a desgarrado.
    if (started) { const torn = {}; withCard.forEach(p => { if ((p.acq || []).includes("enganchado")) { const c = list.find(q => q.id === p.centipede); if (c && c.room && p.room && c.room !== p.room) torn[p.id] = { acq: [...(p.acq || []).filter(k => k !== "enganchado"), "desgarrado"] }; } }); if (Object.keys(torn).length) api.batch(code, null, torn); }
    const es = $("#endStart"); if (es) es.onclick = () => api.updateGame(code, { endPhase: "pre", result: null, revealAt: null });
    const doReveal = manual => api.updateGame(code, { endPhase: "done", result: computeResult(game, list, manual), revealAt: Date.now() + REVEAL_DELAY });
    if (started) autoReveal(code, game, list);
    if (game.endPhase === "done" && countdownLeft(game) > 0) setTimeout(render, 300);
    const er = $("#endReveal"); if (er) er.onclick = () => pend.length ? modal("¿Revelar ya?", "Todavía faltan respuestas. Si revelas ahora, esas respuestas cuentan como «no».", [{ label: "Esperar" }, { label: "Revelar", primary: true, fn: () => doReveal() }]) : doReveal();
    $$("[data-force]").forEach(b => b.onclick = () => doReveal(b.dataset.force));
    const ay = $("#arrestYes"); if (ay) ay.onclick = () => { const r = computeResult(game, list, null); Object.keys(r.res).forEach(k => r.res[k] = { win: k === game.arrest.by, why: k === game.arrest.by ? "Atrapaste a alguien jugando entre rondas." : "Ganó la Policía secreta: todos los demás pierden." });
      r.lines = [`¡La Policía secreta (${game.arrest.byName}) arrestó a ${game.arrest.targetName} jugando entre rondas!`]; r.winner = "?"; api.updateGame(code, { endPhase: "done", result: r, arrest: null, revealAt: Date.now() + REVEAL_DELAY }); };
    const an = $("#arrestNo"); if (an) an.onclick = () => api.updateGame(code, { arrest: null });
    const ec = $("#endCancel"); if (ec) ec.onclick = () => api.updateGame(code, { endPhase: null, result: null });
    $$("[data-lead]").forEach(b => b.onclick = () => { const p = list.find(x => x.id === b.dataset.lead); setLeader(code, game, list, p.room, p.id); });
    $$("[data-move]").forEach(b => b.onclick = () => { const p = list.find(x => x.id === b.dataset.move); const to = otherRoom(p.room);
      const gp = {}; if (game["leader" + p.room] === p.id) gp["leader" + p.room] = null;
      api.batch(code, Object.keys(gp).length ? gp : null, { [p.id]: movePatch(p, to) }); toast(`${p.name} → Cuarto ${to}`); });
    const rr = $("#reroom"); if (rr) rr.onclick = () => modal("¿Reacomodar cuartos?", "Se reparten otra vez todos los jugadores en dos cuartos al azar y se borran los líderes.",
      [{ label: "Cancelar" }, { label: "Sí, reacomodar", primary: true, fn: () => { const ids = shuffle(withCard.map(p => p.id)), half = Math.ceil(ids.length / 2), pt = {};
        ids.forEach((id, i) => pt[id] = { room: i < half ? "1" : "2", vote: null, moves: 0 }); api.batch(code, { leader1: null, leader2: null, picks1: null, picks2: null, offer1: null, offer2: null }, pt); toast("Cuartos reacomodados"); } }]);
    const wk = $("#wake"); if (wk) wk.onclick = async () => { await api.batch(code, { sober: null }, { [drunk.id]: { card: game.sober, acq: [], cured: [], paraUsed: false } }); toast(drunk.name + " ya tiene su carta sobria"); };
    const sa = $("#swapA"), sb = $("#swapB");
    if (sa) { sa.onchange = e => swapA = e.target.value; sb.onchange = e => swapB = e.target.value; }
    const sw = $("#swap"); if (sw) sw.onclick = async () => {
      const A = list.find(p => p.id === swapA), Bp = list.find(p => p.id === swapB);
      if (!A || !Bp || A.id === Bp.id) { toast("Elige dos jugadores distintos"); return; }
      await api.batch(code, null, { [A.id]: { card: Bp.card, acq: [], cured: [], paraUsed: false }, [Bp.id]: { card: A.card, acq: [], cured: [], paraUsed: false } });
      swapA = swapB = ""; toast(`${A.name} y ${Bp.name} intercambiaron cartas`);
    };
    if (confirmEnd) {
      $("#endYes").onclick = async () => { for (const p of list) await api.removePlayer(code, p.id); await api.updateGame(code, { round: 0, ended: true }); ls.set("rs-host", null); go(home); };
      $("#endNo").onclick = () => { confirmEnd = false; render(); };
    } else $("#end").onclick = () => { confirmEnd = true; render(); };
  };
  app().innerHTML = `<div class="narrow"><div class="panel wait"><div class="pulse"></div><p>Abriendo la sala…</p></div></div>`;
  let wakeH = null; const askWakeH = async () => { try { if ("wakeLock" in navigator && !document.hidden) wakeH = await navigator.wakeLock.request("screen"); } catch (e) {} };
  askWakeH(); const onVisH = () => { if (!document.hidden) askWakeH(); }; document.addEventListener("visibilitychange", onVisH);
  unsubs.push(() => { document.removeEventListener("visibilitychange", onVisH); try { wakeH && wakeH.release(); } catch (e) {} });
  unsubs.push(api.watchGame(code, g => { game = g; gl = true; render(); setTimer(g); }));
  unsubs.push(api.watchPlayers(code, l => { players = l; render(); }));
}

// ---------- arranque ----------
langSwitch();
if (ls.get("rs-player")) go(playerView); else go(home);
})();
</script>
